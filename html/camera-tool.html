<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Anima 独立相机控制工具</title>
    <style>
        :root { --bg: #1e1e1e; --panel-bg: #2a2a2a; --text: #d4d4d4; --border: #444; --accent: #4a90e2; --highlight: #ff9800; }
        body { margin: 0; padding: 15px; background-color: var(--bg); color: var(--text); font-family: "Microsoft YaHei", sans-serif; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; overflow: hidden; }
        
        .viewport-container { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        .viewport { flex: 1; background: #000; border-radius: 8px; border: 1px solid var(--border); position: relative; overflow: hidden; cursor: grab; }
        .viewport:active { cursor: grabbing; }

        .footer { display: flex; gap: 15px; }
        .output-box { flex: 1; background: #111; border: 1px solid var(--border); padding: 10px; color: #00ffcc; font-family: monospace; border-radius: 4px; font-size: 14px; white-space: pre-wrap; word-break: break-all; min-height: 42px; display: flex; align-items: center; }
        button { background: var(--accent); color: white; border: none; padding: 0 25px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 14px; }
        button:hover { background: #357abd; }
        
        .controls-panel { width: 400px; background: var(--panel-bg); border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .panel-header { padding: 12px 15px; font-weight: bold; color: var(--highlight); border-bottom: 1px solid var(--border); font-size: 15px; }
        .control-section { padding: 15px; border-bottom: 1px solid var(--border); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .control-title { font-size: 13px; color: #4a90e2; font-weight: bold; margin-bottom: 0; }
        .reset-btn { background: #444; color: #ccc; border: 1px solid #555; padding: 2px 8px; border-radius: 3px; font-size: 12px; cursor: pointer; font-weight: normal; }
        .reset-btn:hover { background: #555; color: #fff; }
        
        .slider-row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 12px; }
        .slider-row:last-child { margin-bottom: 0; }
        .slider-row label { width: 65px; color: #ccc; }
        .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
        .slider-row input[type="number"] { width: 60px; background: #111; border: 1px solid var(--border); color: #fff; padding: 3px 5px; border-radius: 3px; text-align: center; }
        .slider-row input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; width: 16px; height: 16px; }
        
        .tag-settings { display: flex; flex-direction: column; gap: 8px; }
        .tag-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .tag-item span { width: 50px; color: #aaa; }
        .tag-item input[type="text"] { flex: 1; background: #111; border: 1px solid var(--border); color: #fff; padding: 4px 8px; border-radius: 3px; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .v-btn { background: rgba(74, 144, 226, 0.8); color: #fff; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; border: none; transition: 0.2s; text-align: center; flex: 1; }
        .v-btn:hover { background: var(--accent); }
        .v-btn.danger { background: rgba(231, 76, 60, 0.8); }
        .v-btn.danger:hover { background: #c0392b; }
        .v-btn.success { background: rgba(76, 175, 80, 0.8); }
        .v-btn.success:hover { background: #388e3c; }
    </style>
</head>
<body>
    <div class="viewport-container">
        <div class="viewport" id="viewport">
            <div style="position:absolute; top:10px; left:10px; color:#666; font-size:12px; pointer-events:none; z-index:10;">
                左键拖拽调整视角 | 滚轮调整距离
            </div>
        </div>
        <div class="footer">
            <div class="output-box" id="output">等待操作...</div>
            <button id="btn-copy">复制</button>
        </div>
    </div>

    <div class="controls-panel">
        <div class="panel-header">参数控制</div>
        
        <!-- 图像控制区 -->
        <div class="control-section">
            <div class="section-header">
                <div class="control-title">图像控制 (PNG纸片)</div>
                <button class="reset-btn" id="reset-image">重置</button>
            </div>
            <div class="btn-group">
                <input type="file" id="fileInput" accept="image/png" style="display: none;">
                <button class="v-btn" onclick="document.getElementById('fileInput').click()">上传 PNG</button>
                <button class="v-btn danger" id="btn-remove-img">删除图片</button>
            </div>
            <div class="slider-row"><label>整体缩放</label><input type="range" id="img_scale" min="0.1" max="5" step="0.1" value="1"></div>
            <div class="slider-row"><label>上下 (Y)</label><input type="range" id="img_pos_y" min="-5" max="5" step="0.1" value="0"></div>
            <div class="slider-row"><label>前后 (Z)</label><input type="range" id="img_pos_z" min="-5" max="5" step="0.1" value="0"></div>
            <div class="slider-row"><label>左右 (X)</label><input type="range" id="img_pos_x" min="-5" max="5" step="0.1" value="0"></div>
        </div>

        <!-- 摄像机核心轴 -->
        <div class="control-section">
            <div class="section-header">
                <div class="control-title">摄像机核心轴 (直接映射视角)</div>
                <button class="reset-btn" id="reset-core">重置</button>
            </div>
            <div class="slider-row"><label>方位轴</label><input type="range" id="pos_x" min="-1" max="1" step="0.01" value="0"><input type="number" id="num_x" value="0" step="0.01"></div>
            <div class="slider-row"><label>高度轴</label><input type="range" id="pos_y" min="-1" max="1" step="0.01" value="0"><input type="number" id="num_y" value="0" step="0.01"></div>
            <div class="slider-row"><label>距离轴</label><input type="range" id="pos_z" min="-1" max="1" step="0.01" value="0"><input type="number" id="num_z" value="0" step="0.01"></div>
            <div class="slider-row"><label>倾斜轴</label><input type="range" id="pos_roll" min="-1" max="1" step="0.1" value="0"><input type="number" id="num_roll" value="0" step="0.1"></div>
        </div>

        <!-- 权重与微调区 -->
        <div class="control-section">
            <div class="section-header">
                <div class="control-title" style="color: var(--highlight);">权重与微调</div>
                <button class="reset-btn" id="reset-weights">重置</button>
            </div>
            <div class="slider-row">
                <label>全局乘数</label>
                <input type="range" id="mult_global" min="0.1" max="10" step="0.1" value="1">
                <input type="number" id="num_mult_global" value="1" step="0.1">
                <div style="width:16px;"></div>
            </div>
            <div class="slider-row">
                <label>方位乘数</label>
                <input type="range" id="mult_x" min="1" max="20" step="1" value="10">
                <input type="number" id="num_mult_x" value="10">
                <input type="checkbox" id="chk_mult_x" checked>
            </div>
            <div class="slider-row">
                <label>高度乘数</label>
                <input type="range" id="mult_y" min="1" max="20" step="1" value="10">
                <input type="number" id="num_mult_y" value="10">
                <input type="checkbox" id="chk_mult_y" checked>
            </div>
            <div class="slider-row">
                <label>距离乘数</label>
                <input type="range" id="mult_z" min="0.1" max="10" step="0.1" value="1">
                <input type="number" id="num_mult_z" value="1" step="0.1">
                <input type="checkbox" id="chk_mult_z" checked>
            </div>
            <div class="slider-row">
                <label>倾斜乘数</label>
                <input type="range" id="mult_roll" min="0.1" max="10" step="0.1" value="1">
                <input type="number" id="num_mult_roll" value="1" step="0.1">
                <input type="checkbox" id="chk_mult_roll" checked>
            </div>
        </div>

        <!-- 标签自定义 -->
        <div class="control-section" style="flex: 1; border-bottom: none;">
            <div class="section-header">
                <div class="control-title">标签替换 (插件目录/html/tags.txt)</div>
                <div>
                    <button class="v-btn" style="padding: 2px 8px; font-size: 12px; background: #555;" onclick="document.getElementById('importTagsFile').click()">导入</button>
                    <button class="v-btn success" id="btn-save-tags" style="padding: 2px 8px; font-size: 12px;">保存</button>
                </div>
            </div>
            <input type="file" id="importTagsFile" accept=".txt" style="display: none;">
            <div class="tag-settings">
                <div class="tag-item"><span>前方</span> <input type="text" id="tag-front" value="from front"></div>
                <div class="tag-item"><span>后方</span> <input type="text" id="tag-back" value="from behind"></div>
                <div class="tag-item"><span>左侧</span> <input type="text" id="tag-left" value="facing right"></div>
                <div class="tag-item"><span>右侧</span> <input type="text" id="tag-right" value="facing left"></div>
                <div class="tag-item"><span>俯视</span> <input type="text" id="tag-high" value="high angle"></div>
                <div class="tag-item"><span>平视</span> <input type="text" id="tag-eye" value="eye-level"></div>
                <div class="tag-item"><span>仰视</span> <input type="text" id="tag-low" value="low angle"></div>
                <div class="tag-item"><span>特写</span> <input type="text" id="tag-ecu" value="extreme close-up"></div>
                <div class="tag-item"><span>近景</span> <input type="text" id="tag-cu" value="close-up"></div>
                <div class="tag-item"><span>中景</span> <input type="text" id="tag-medium" value="medium shot"></div>
                <div class="tag-item"><span>牛仔</span> <input type="text" id="tag-cowboy" value="cowboy shot"></div>
                <div class="tag-item"><span>全身</span> <input type="text" id="tag-full" value="full body"></div>
                <div class="tag-item"><span>远景</span> <input type="text" id="tag-wide" value="wide shot"></div>
                <div class="tag-item"><span>倾斜</span> <input type="text" id="tag-dutch" value="dutch angle"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let state = { x: 0, y: 0, z: 0, roll: 0 };
        const tagKeys = ['front', 'back', 'left', 'right', 'high', 'eye', 'low', 'ecu', 'cu', 'medium', 'cowboy', 'full', 'wide', 'dutch'];

        // === 标签配置逻辑 ===
        function applyTagsToUI(tagsData) {
            tagKeys.forEach(key => {
                const el = document.getElementById('tag-' + key);
                if (el && tagsData[key] !== undefined) el.value = tagsData[key];
            });
            updateCameraAndOutput();
        }

        function getTagsFromUI() {
            let tagsData = {};
            tagKeys.forEach(key => {
                const el = document.getElementById('tag-' + key);
                if (el) tagsData[key] = el.value;
            });
            return tagsData;
        }

        function parseTagsText(text) {
            const tagsData = {};
            text.split(/\r?\n/).forEach(line => {
                if (!line.trim()) return;
                const colonIndex = line.indexOf(':');
                if (colonIndex > 0) {
                    const k = line.substring(0, colonIndex).trim();
                    const v = line.substring(colonIndex + 1).trim();
                    if (tagKeys.includes(k)) tagsData[k] = v;
                }
            });
            return tagsData;
        }

        async function loadTagsFile() {
            try {
                const resp = await fetch('/anima_camera/get_tags');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.tags) {
                        applyTagsToUI(parseTagsText(data.tags));
                        return;
                    }
                }
            } catch (e) {}
            try {
                const resp = await fetch('./tags.txt?t=' + new Date().getTime());
                if (resp.ok) {
                    const text = await resp.text();
                    if (!text.includes('<!DOCTYPE html>')) {
                        applyTagsToUI(parseTagsText(text));
                        return;
                    }
                }
            } catch (e) {}
            const cached = localStorage.getItem('anima_tags');
            if (cached) applyTagsToUI(JSON.parse(cached));
        }

        document.getElementById('importTagsFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                applyTagsToUI(parseTagsText(event.target.result));
                localStorage.setItem('anima_tags', JSON.stringify(getTagsFromUI()));
                alert('✅ 成功导入标签配置！');
            };
            reader.readAsText(file);
        });

        document.querySelectorAll('.tag-settings input[type="text"]').forEach(input => {
            input.addEventListener('input', () => {
                localStorage.setItem('anima_tags', JSON.stringify(getTagsFromUI()));
                updateCameraAndOutput();
            });
        });

        document.getElementById('btn-save-tags').addEventListener('click', async () => {
            const tagsData = getTagsFromUI();
            let content = "";
            tagKeys.forEach(k => { content += `${k}: ${tagsData[k]}\n`; });
            try {
                const resp = await fetch('/anima_camera/save_tags', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tags: content })
                });
                if (resp.ok) {
                    const result = await resp.json();
                    if (result.status === 'success') {
                        alert('✅ 标签已成功保存到后台文件！');
                        return;
                    }
                }
            } catch (e) {}
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({ suggestedName: 'tags.txt', types: [{ description: 'Text Files', accept: {'text/plain': ['.txt']} }] });
                    const writable = await handle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    alert('✅ 标签已成功保存！');
                    return;
                } catch (err) {}
            }
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'tags.txt';
            a.click();
            alert('✅ tags.txt 已下载，请覆盖原文件！');
        });

        loadTagsFile();

        // === 3D 渲染与交互核心逻辑 ===
        const viewport = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a); 

        const camera = new THREE.PerspectiveCamera(40, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        viewport.appendChild(renderer.domElement);

        // === 需求：区分正反面 ===
        // 正面材质（只在前方可见）
        const frontMat = new THREE.MeshBasicMaterial({ color: 0x333333, transparent: true, side: THREE.FrontSide, depthWrite: false });
        const spritePlane = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 3.5), frontMat);
        scene.add(spritePlane);

        // 背面材质（只在后方可见，颜色设为深色以实现“黑一半”效果）
        const backMat = new THREE.MeshBasicMaterial({ color: 0x666666, transparent: true, side: THREE.BackSide, depthWrite: false });
        const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 3.5), backMat);
        // 向后偏移一点点，防止正反面渲染冲突（Z-fighting）
        backPlane.position.z = -0.02; 
        scene.add(backPlane);

        // 线框占位
        const wireframeBox = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.5, 0.1), new THREE.MeshBasicMaterial({color: 0x555555, wireframe: true}));
        scene.add(wireframeBox);

        function loadImage(url) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.setCrossOrigin('anonymous');
            textureLoader.load(url, 
                function(texture) {
                    // 贴图赋给正面（保持原色）
                    frontMat.map = texture;
                    frontMat.color.setHex(0xffffff); 
                    frontMat.needsUpdate = true;

                    // 贴图赋给背面（配合灰底色，变暗一半）
                    backMat.map = texture;
                    backMat.color.setHex(0x666666); // 这里的颜色会和贴图相乘
                    backMat.needsUpdate = true;

                    wireframeBox.visible = false;

                    // 图片自适应比例
                    const imgWidth = texture.image.width;
                    const imgHeight = texture.image.height;
                    const aspect = imgWidth / imgHeight;
                    const maxSize = 3.5;
                    
                    let w, h;
                    if (aspect > 1) { w = maxSize; h = maxSize / aspect; } 
                    else { h = maxSize; w = maxSize * aspect; }

                    // 同步更新正反面的几何体尺寸
                    spritePlane.geometry.dispose();
                    spritePlane.geometry = new THREE.PlaneGeometry(w, h);
                    backPlane.geometry.dispose();
                    backPlane.geometry = new THREE.PlaneGeometry(w, h);

                    wireframeBox.geometry.dispose();
                    wireframeBox.geometry = new THREE.BoxGeometry(w, h, 0.1);
                },
                undefined, 
                function(err) { console.log("未找到默认图片 img.png，显示线框。"); }
            );
        }
        loadImage('./img.png');

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) { loadImage(event.target.result); };
            reader.readAsDataURL(file);
        });

        document.getElementById('btn-remove-img').addEventListener('click', () => {
            frontMat.map = null;
            frontMat.color.setHex(0x333333);
            frontMat.needsUpdate = true;

            backMat.map = null;
            backMat.color.setHex(0x666666);
            backMat.needsUpdate = true;

            wireframeBox.visible = true;
            document.getElementById('fileInput').value = '';
            
            spritePlane.geometry.dispose();
            spritePlane.geometry = new THREE.PlaneGeometry(2.5, 3.5);
            backPlane.geometry.dispose();
            backPlane.geometry = new THREE.PlaneGeometry(2.5, 3.5);
            wireframeBox.geometry.dispose();
            wireframeBox.geometry = new THREE.BoxGeometry(2.5, 3.5, 0.1);
        });

        function updateTransform() {
            const s = parseFloat(document.getElementById('img_scale').value);
            const posY = parseFloat(document.getElementById('img_pos_y').value);
            const posZ = parseFloat(document.getElementById('img_pos_z').value);
            const posX = parseFloat(document.getElementById('img_pos_x').value);
            
            // 同步缩放
            spritePlane.scale.set(s, s, 1);
            backPlane.scale.set(s, s, 1);
            wireframeBox.scale.set(s, s, 1);
            
            // 同步位置，背后皮保持 -0.02 的偏移
            spritePlane.position.set(posX, posY, posZ);
            backPlane.position.set(posX, posY, posZ - 0.02);
            wireframeBox.position.set(posX, posY, posZ);
        }

        ['img_scale', 'img_pos_y', 'img_pos_z', 'img_pos_x'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateTransform);
        });

        document.getElementById('reset-image').addEventListener('click', () => {
            document.getElementById('img_scale').value = 1;
            document.getElementById('img_pos_y').value = 0;
            document.getElementById('img_pos_z').value = 0;
            document.getElementById('img_pos_x').value = 0;
            updateTransform();
        });

        const grid = new THREE.GridHelper(20, 20, 0x333333, 0x1a1a1a);
        grid.position.y = -1.75;
        scene.add(grid);

        const distIntervals = [
            { max: -0.7, tag: 'tag-ecu' },
            { max: -0.3, tag: 'tag-cu' },
            { max: 0.1, tag: 'tag-medium' },
            { max: 0.4, tag: 'tag-cowboy' },
            { max: 0.7, tag: 'tag-full' },
            { max: 1.0, tag: 'tag-wide' }
        ];

        // === 鼠标控制 3D 画布 ===
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        const dragSensitivity = 0.005;

        viewport.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            }
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        viewport.addEventListener('mouseleave', () => { isDragging = false; });

        viewport.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.offsetX - previousMousePosition.x;
            const deltaY = e.offsetY - previousMousePosition.y;
            
            state.x += deltaX * dragSensitivity;
            state.y += deltaY * dragSensitivity;
            
            state.x = Math.max(-1, Math.min(1, state.x));
            state.y = Math.max(-1, Math.min(1, state.y));
            
            document.getElementById('pos_x').value = state.x;
            document.getElementById('num_x').value = state.x.toFixed(2);
            document.getElementById('pos_y').value = state.y;
            document.getElementById('num_y').value = state.y.toFixed(2);
            
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
            updateCameraAndOutput();
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomDirection = e.deltaY > 0 ? -1 : 1;
            const zoomStep = 0.05;
            
            state.z += zoomDirection * zoomStep;
            state.z = Math.max(-1, Math.min(1, state.z));
            
            document.getElementById('pos_z').value = state.z;
            document.getElementById('num_z').value = state.z.toFixed(2);
            
            updateCameraAndOutput();
        }, { passive: false });


        function updateCameraAndOutput() {
            const azimuthRad = state.x * Math.PI; 
            const elevationRad = state.y * (Math.PI / 2 * 0.95);
            const radius = 6 + state.z * 4; 
            
            const camX = radius * Math.cos(elevationRad) * Math.sin(azimuthRad);
            const camY = radius * Math.sin(elevationRad);
            const camZ = radius * Math.cos(elevationRad) * Math.cos(azimuthRad);

            camera.position.set(camX, camY, camZ);
            camera.up.set(0, 1, 0);
            camera.lookAt(0, 0, 0); 

            if (state.roll !== 0) {
                const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), state.roll * (Math.PI / 4));
                camera.quaternion.multiply(q);
            }

            let tags = [];
            const globalM = parseFloat(document.getElementById('num_mult_global').value);
            
            const azM_val = parseFloat(document.getElementById('num_mult_x').value);
            const azM = document.getElementById('chk_mult_x').checked ? azM_val : 1;

            const elM_val = parseFloat(document.getElementById('num_mult_y').value);
            const elM = document.getElementById('chk_mult_y').checked ? elM_val : 1;

            const distM_val = parseFloat(document.getElementById('num_mult_z').value);
            const distM = document.getElementById('chk_mult_z').checked ? distM_val : 1;

            const rollM_val = parseFloat(document.getElementById('num_mult_roll').value);
            const rollM = document.getElementById('chk_mult_roll').checked ? rollM_val : 1;

            // 方位
            let azTag = document.getElementById('tag-front').value;
            if (state.x > 0.15) azTag = document.getElementById('tag-right').value;
            else if (state.x < -0.15) azTag = document.getElementById('tag-left').value;
            else if (Math.abs(state.x) > 0.85) azTag = document.getElementById('tag-back').value;
            
            let azGate = Math.abs(state.y) > 0.9 ? Math.max(0, 1 - (Math.abs(state.y) - 0.9) * 10) : 1;
            let azWeight = Math.abs(state.x) * azM * globalM * azGate;
            if (Math.abs(state.x) < 0.05 && state.x !== 0) azWeight = azM * globalM;
            
            if (state.x !== 0 && azWeight > 0.1) tags.push(`(${azTag}:${azWeight.toFixed(2)})`);

            // 高度
            let elTag = document.getElementById('tag-eye').value;
            let isEyeLevel = Math.abs(state.y) <= 0.15;
            if (state.y > 0.15) elTag = document.getElementById('tag-high').value;
            else if (state.y < -0.15) elTag = document.getElementById('tag-low').value;
            
            let elWeight = Math.abs(state.y) * elM * globalM;
            if (isEyeLevel) elWeight = elM * globalM * 1.5; 
            if (state.y !== 0 && elWeight > 0.1) tags.push(`(${elTag}:${elWeight.toFixed(2)})`);

            // 距离
            if (state.z !== 0) {
                let currentIndex = distIntervals.findIndex(inv => state.z <= inv.max + 0.0001);
                if (currentIndex === -1) currentIndex = distIntervals.length - 1;

                const currentInv = distIntervals[currentIndex];
                const currentTagText = document.getElementById(currentInv.tag).value;

                const leftBound = currentIndex === 0 ? -1.0 : distIntervals[currentIndex - 1].max;
                const rightBound = currentInv.max;
                const center = (leftBound + rightBound) / 2;
                const halfLen = (rightBound - leftBound) / 2;

                const offset = Math.abs(state.z - center);
                let weightRatio = 1.0 - (offset / halfLen) * 0.9;
                weightRatio = Math.max(0.1, Math.min(1.0, weightRatio));

                let currentDistWeight = weightRatio * distM * globalM;
                if (currentDistWeight > 0.1) tags.push(`(${currentTagText}:${currentDistWeight.toFixed(2)})`);

                if (weightRatio < 0.99) {
                    let extraTagText = null;
                    if (state.z < center && currentIndex > 0) {
                        extraTagText = document.getElementById(distIntervals[currentIndex - 1].tag).value;
                    } else if (state.z > center && currentIndex < distIntervals.length - 1) {
                        extraTagText = document.getElementById(distIntervals[currentIndex + 1].tag).value;
                    }
                    if (extraTagText) tags.push(`(${extraTagText}:1.00)`);
                }
            }

            // 倾斜
            if (state.roll !== 0) {
                let baseRollWeight = 1 + Math.abs(state.roll) - 0.1;
                let rollWeight = baseRollWeight * rollM * globalM;
                if (rollWeight > 0.1) tags.push(`(${document.getElementById('tag-dutch').value}:${rollWeight.toFixed(2)})`);
            }

            document.getElementById('output').innerText = tags.length === 0 ? "" : tags.join(', ');
        }

        function bindInput(id, stateKey) {
            const slider = document.getElementById(`pos_${id}`);
            const num = document.getElementById(`num_${id}`);
            const update = (val) => {
                if(stateKey) state[stateKey] = parseFloat(val);
                if(slider) slider.value = val;
                if(num) num.value = val;
                updateCameraAndOutput();
            };
            if (slider) slider.addEventListener('input', (e) => update(e.target.value));
            if (num) num.addEventListener('change', (e) => update(e.target.value));
        }
        bindInput('x', 'x'); bindInput('y', 'y'); bindInput('z', 'z'); bindInput('roll', 'roll');

        function bindMultiplier(id) {
            const slider = document.getElementById(`mult_${id}`);
            const num = document.getElementById(`num_mult_${id}`);
            const chk = document.getElementById(`chk_mult_${id}`);
            const update = (val) => {
                if(slider) slider.value = val;
                if(num) num.value = val;
                updateCameraAndOutput();
            };
            if (slider) slider.addEventListener('input', (e) => update(e.target.value));
            if (num) num.addEventListener('change', (e) => update(e.target.value));
            if (chk) chk.addEventListener('change', updateCameraAndOutput);
        }
        
        bindMultiplier('global'); bindMultiplier('x'); bindMultiplier('y'); bindMultiplier('z'); bindMultiplier('roll');

        function resetUI(id, val) {
            const slider = document.getElementById(`pos_${id}`) || document.getElementById(`mult_${id}`);
            const num = document.getElementById(`num_${id}`) || document.getElementById(`num_mult_${id}`);
            if (slider) slider.value = val;
            if (num) num.value = val;
        }

        document.getElementById('reset-core').addEventListener('click', () => {
            state.x = 0; state.y = 0; state.z = 0; state.roll = 0;
            resetUI('x', 0); resetUI('y', 0); resetUI('z', 0); resetUI('roll', 0);
            updateCameraAndOutput();
        });

        document.getElementById('reset-weights').addEventListener('click', () => {
            document.getElementById('mult_global').value = 1; document.getElementById('num_mult_global').value = 1;
            document.getElementById('mult_x').value = 10; document.getElementById('num_mult_x').value = 10;
            document.getElementById('mult_y').value = 10; document.getElementById('num_mult_y').value = 10;
            document.getElementById('mult_z').value = 1;  document.getElementById('num_mult_z').value = 1;
            document.getElementById('mult_roll').value = 1; document.getElementById('num_mult_roll').value = 1;
            ['x', 'y', 'z', 'roll'].forEach(id => document.getElementById(`chk_mult_${id}`).checked = true);
            updateCameraAndOutput();
        });

        document.getElementById('btn-copy').addEventListener('click', () => {
            const text = document.getElementById('output').innerText;
            if(text && text !== '等待操作...') {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('btn-copy');
                    btn.innerText = '已复制!'; btn.style.background = '#4caf50';
                    setTimeout(() => { btn.innerText = '复制'; btn.style.background = ''; }, 1500);
                });
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        });

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
        updateCameraAndOutput();
    </script>
</body>
</html>
